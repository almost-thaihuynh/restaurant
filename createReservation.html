<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="practice/form.css">
    <title>Create Reservation</title>
</head>
<body>
    <header class="header-init">
        <h1>Welcome to the Huynh'ers</h1>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="reservation.html">Reservations</a>
            <a href="createReservation.html">Create a Reservation</a>
        </nav>
    </header>
    <main>
        <div class="reservation-wrapper">
            <div class="reservation-header">
                <h1>Reserve your table</h1>
                <p>
                    Reserve your table with us and enjoy a relaxed dining experience. Choose your date, time, and party size below, then enter your payment information to complete your reservation.
                </p>
            </div>
            <form class="reservation-form">
                <!-- Date, time, party size, guest name, status. -->
                 <div class="input-group">
                    <label>Date:</label>
                    <input type="date" id="time" name="time">
                 </div>

                 <div class="input-group">
                    <label>Time:</label>
                    <input type="time" id="party-size" name="party-size">
                 </div>

                 <div class="input-group">
                    <label>Party Size:</label>
                    <input type="number">
                 </div>

                 <div class="input-group">
                    <label>Group Name:</label>
                    <input type="text" id="group-name" name="group-name">
                 </div>

                 <div class="input-group">
                    <label>Status:</label>
                    <select name="status" id="status">
                        <option value="" disabled selected> --- Select one status ---</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="pending">Pending</option>
                        <option value="cancel">Cancelled</option>
                    </select>
                 </div>

                 <!-- payment section. -->
                 <div class="payment-section">
                    <h2>Payment Information</h2>

                        <div class="input-group">
                            <label for="card-name">Name on Card:</label>
                            <input type="text" id="card-name" name="card-name">
                        </div>

                        <div class="input-group">
                            <label for="card-number">Card Number:</label>
                            <input type="text" id="card-number" name="card-number" maxlength="19">
                        </div>

                        <div class="payment-row">
                            <div class="input-group">
                            <label for="expiration">Expiration Date:</label>
                            <input type="month" id="expiration" name="expiration">
                            </div>

                            <div class="input-group">
                            <label for="cvv">CVV:</label>
                            <input type="text" id="cvv" name="cvv" maxlength="4">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="billing-zip">Billing ZIP Code:</label>
                            <input type="text" id="billing-zip" name="billing-zip" maxlength="10">
                        </div>
                </div>

<button type="submit" class="reservation-button">
    Reserve Table
</button>
            </form>

        </div>
    </main>
    
</body>
</html>
