<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>

    <form action="" method=""><!-- these attributes allow us to handle data to the server -->
        <label>First name:</label>
        <input type="text" id="fname">

        <label for="lname">Last Name:</label>
        <input type="text" id="lname">

        <input type="submit" value="Submit">
        
    </form>

    <p>Select the options tha applies to you: </p>

    <form>
        <input type="checkbox" id="vehicle1" name="vehicle1" value="bike">
        <label>I have a bike</label>

        <input type="checkbox" id="vehicle2" name="vehicle2" value="car">
        <label>I have a car</label>

        <input type="checkbox" id="vehicle3" name="vehicle3" value="boat">
        <label>I have a boat</label>

        <input type="submit" value="Submit">

    </form>

    <p>Elements inside of a form</p>
    <form>
        <fieldset>
            <legend>Contact information:</legend>
            <label>First name:</label>
            <input type="text" id="fname">
            <label for="lname">Last Name:</label>
        <input type="text" id="lname">
        </fieldset>

        <fieldset>
            <legend>Vehicles</legend>
            <label for="cars">Choose a car:</label>
            <select id="cars">
                <option value="bmw">BMW</option>
                <option value="toyota">Toyota</option>
                <option value="ford">Ford</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Body:</legend>
            <label>Leave a message:</label>
            <textarea name="message" rows="10" cols="80" placeholder="type here..."></textarea>
        </fieldset>

        <fieldset>
            <legend>Input Types</legend>

            <label>Password</label>
            <input type="password" id="password" maxlength="8">
            <br>
            <!-- color field -->
             <label>Color:</label>
        <input type="color" id="fcolor"><br>

            <!-- date -->
             <label>Date:</label>
        <input type="date" id="fdate"><br>

            <!-- email -->
             <label>Email:</label>
        <input type="email" id="femail"><br>

            <!-- file -->
             <label>File:</label>
        <input type="file" id="ffile"><br>

            <!-- number -->
             <label>Number:</label>
        <input type="tnumber" id="fnumber"><br>

        </fieldset>

        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
